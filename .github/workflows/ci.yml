name: React and SQLite MVP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: shareyourmountain-application
          path: |
            dist/client/
            src/server/
            src/shared/
            package.json
            package-lock.json
            tsconfig.json
